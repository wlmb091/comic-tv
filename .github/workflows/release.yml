name: Build and publish Comic TV
on:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'mihon/**', 'tools/**', 'distribution/**', 'gradle/**', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'docs/releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comic-tv-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wlmb091/comic-tv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: version
        run: node tools/update-release.mjs inspect
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android tools
        if: steps.version.outputs.needed == 'true'
        run: bash distribution/tools/setup-android.sh 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests, release and lint (no signing secrets)
        if: steps.version.outputs.needed == 'true'
        run: |
          chmod +x gradlew
          node --test tools/update-release.test.mjs
          node --test tools/browser-blob.test.mjs
          ./gradlew :core:test :mihon:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest :app:lintRelease --build-cache --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          node tools/check-history-migration.mjs
          node tools/check-library-organization.mjs
          mkdir -p "$RUNNER_TEMP/dex"
          unzip -j app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' -d "$RUNNER_TEMP/dex"
          node tools/check-extension-abi.mjs "$RUNNER_TEMP/dex"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.version.outputs.needed == 'true'
        with:
          name: comic-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  sign-and-stage:
    needs: build
    if: needs.build.outputs.needed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: bash distribution/tools/setup-android.sh 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: comic-unsigned
          path: ${{ runner.temp }}/comic-unsigned
      - name: Sign on a fresh runner after tests
        run: node tools/sign-release.mjs
        env:
          COMIC_TV_SIGNING_KEYSTORE: ${{ secrets.COMIC_TV_SIGNING_KEYSTORE }}
          COMIC_TV_SIGNING_STORE_PASSWORD: ${{ secrets.COMIC_TV_SIGNING_STORE_PASSWORD }}
          COMIC_TV_SIGNING_KEY_PASSWORD: ${{ secrets.COMIC_TV_SIGNING_KEY_PASSWORD }}
      - name: Stage only APK and metadata in the public channel
        run: node tools/stage-update.mjs
        env:
          COMIC_TV_PUBLISH_SSH_KEY: ${{ secrets.COMIC_TV_PUBLISH_SSH_KEY }}
